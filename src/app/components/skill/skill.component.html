<header class="header">
  <div class="logo">Manal Kerroumi</div>
  <nav>
    <ul>
      <li><a routerLink="/" routerLinkActive="active">À propos</a></li>
      <li><a routerLink="/project" routerLinkActive="active">Projets</a></li>
      <li><a routerLink="/certification" routerLinkActive="active">Certifications</a></li>
      <li><a routerLink="/formation" routerLinkActive="active">Formations</a></li>
      <li><a routerLink="/experience" routerLinkActive="active">Expériences</a></li>
      <li><a routerLink="/skills" routerLinkActive="active">Compétences</a></li>
      <li><a routerLink="/contact" routerLinkActive="active">Contact</a></li>
      <li>
        <a href="assets/docs/manal-kerroumi.pdf" download="cv-manal-kerroumi.pdf" class="cv-btn">
          CV
        </a>
      </li>
    </ul>
  </nav>
  <div class="header-right">
    <i class="fa-solid fa-globe header-globe"></i>
    <select class="language-select">
      <option value="fr">FR</option>
      <option value="en">EN</option>
    </select>
  </div>
</header>

<!-- Skills Section -->
<section class="skills-container">
  <h1>Mes Compétences</h1>

  <div class="skills-grid">
    <div *ngFor="let category of categories" class="skill-card">
      <h2>{{ category.name }}</h2>
      <div class="skills-list">
        <span class="skill-badge" *ngFor="let skill of category.skills">
          <i [class]="skill.icon"></i> {{ skill.description }}
        </span>
      </div>
    </div>
  </div>
</section>
