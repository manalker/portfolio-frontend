<!-- Bouton flottant -->
<button
  (click)="toggleChat()"
  class="fixed bottom-6 right-5 w-14 h-14 rounded-full border-none cursor-pointer z-[1000] flex items-center justify-center text-2xl transition-all duration-300 hover:scale-110"
  [style.background]="isDark ? '#00e0ff' : '#0066cc'"
  style="color: #000;"
  [style.boxShadow]="isDark ? '0 0 20px rgba(0,224,255,0.5)' : '0 0 20px rgba(0,102,204,0.4)'">
  <i class="fas" [class.fa-comments]="!isOpen" [class.fa-times]="isOpen"></i>
</button>

<!-- Fenêtre chat — desktop + mobile -->
<div class="fixed z-[999] transition-all duration-300 origin-bottom-right flex flex-col
            bottom-[5.5rem] right-5 w-[360px] h-[520px]
            sm:bottom-[5.5rem] sm:right-5 sm:w-[360px] sm:h-[520px]
            max-[480px]:bottom-0 max-[480px]:right-0 max-[480px]:left-0
            max-[480px]:w-full max-[480px]:h-[92dvh]
            max-[480px]:rounded-t-2xl max-[480px]:rounded-b-none
            rounded-2xl"
     [class.scale-0]="!isOpen" [class.opacity-0]="!isOpen" [class.pointer-events-none]="!isOpen"
     [class.scale-100]="isOpen" [class.opacity-100]="isOpen" [class.pointer-events-auto]="isOpen"
     [style.background]="isDark ? '#0d0d1a' : '#ffffff'"
     [style.border]="isDark ? '1px solid rgba(0,224,255,0.25)' : '1px solid rgba(0,102,204,0.2)'"
     [style.boxShadow]="isDark ? '0 0 40px rgba(0,224,255,0.15)' : '0 4px 30px rgba(0,102,204,0.15)'">

  <!-- Header -->
  <div class="flex items-center gap-3 px-4 py-3 rounded-t-2xl border-b flex-shrink-0 transition-colors duration-300"
       [style.background]="isDark ? 'rgba(0,224,255,0.05)' : 'rgba(0,102,204,0.05)'"
       [style.borderColor]="isDark ? 'rgba(0,224,255,0.15)' : 'rgba(0,102,204,0.15)'">

    <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white text-sm flex-shrink-0"
         style="background: linear-gradient(135deg, #00e0ff, #6f42c1);">MK</div>

    <div class="flex flex-col">
      <span class="font-semibold text-[0.95rem] transition-colors duration-300"
            [class.text-white]="isDark" [class.text-gray-800]="!isDark">
        Assistant de Manal
      </span>
      <span class="flex items-center gap-1 text-[0.75rem] text-gray-400">
        <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
        En ligne
      </span>
    </div>

    <button (click)="toggleChat()"
            class="ml-auto bg-transparent border-none cursor-pointer text-base transition-colors duration-200 p-1"
            [class.text-gray-400]="isDark" [class.hover:text-white]="isDark"
            [class.text-gray-500]="!isDark" [class.hover:text-gray-800]="!isDark">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- Messages -->
  <div #messagesContainer
       class="flex-1 overflow-y-auto px-4 py-3 flex flex-col gap-3 min-h-0"
       style="scrollbar-width: thin; scrollbar-color: #00e0ff transparent;">

    <div *ngFor="let msg of messages"
         class="flex"
         [class.justify-end]="msg.role === 'user'"
         [class.justify-start]="msg.role === 'assistant'">

      <div *ngIf="msg.role === 'user'"
           class="max-w-[80%] px-4 py-2 rounded-2xl rounded-br-sm text-sm leading-relaxed font-medium"
           [style.background]="isDark ? '#00e0ff' : '#0066cc'"
           style="color: #fff;">
        {{ msg.content }}
      </div>

      <div *ngIf="msg.role === 'assistant'"
           class="max-w-[88%] px-4 py-3 rounded-2xl rounded-bl-sm text-sm leading-relaxed chatbot-bubble transition-colors duration-300"
           [class.bubble-dark]="isDark"
           [class.bubble-light]="!isDark"
           [innerHTML]="msg.html || msg.content">
      </div>
    </div>

    <!-- Typing -->
    <div *ngIf="isLoading" class="flex justify-start">
      <div class="px-4 py-3 rounded-2xl rounded-bl-sm flex gap-1 items-center"
           [style.background]="isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,102,204,0.07)'"
           [style.border]="isDark ? '1px solid rgba(0,224,255,0.15)' : '1px solid rgba(0,102,204,0.15)'">
        <span class="w-2 h-2 rounded-full animate-bounce"
              [style.background]="isDark ? '#00e0ff' : '#0066cc'"></span>
        <span class="w-2 h-2 rounded-full animate-bounce [animation-delay:200ms]"
              [style.background]="isDark ? '#00e0ff' : '#0066cc'"></span>
        <span class="w-2 h-2 rounded-full animate-bounce [animation-delay:400ms]"
              [style.background]="isDark ? '#00e0ff' : '#0066cc'"></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="flex gap-2 px-4 py-3 border-t flex-shrink-0 transition-colors duration-300"
       [style.borderColor]="isDark ? 'rgba(0,224,255,0.15)' : 'rgba(0,102,204,0.15)'">
    <input
      type="text"
      [(ngModel)]="userInput"
      (keypress)="onKeyPress($event)"
      placeholder="Posez une question..."
      [disabled]="isLoading"
      class="flex-1 rounded-full px-4 py-2 text-sm outline-none transition-all duration-300 border"
      [class.bg-white/5]="isDark" [class.text-white]="isDark"
    [class.placeholder-gray-500]="isDark"
    [class.bg-gray-100]="!isDark" [class.text-gray-800]="!isDark"
    [style.borderColor]="isDark ? 'rgba(0,224,255,0.2)' : 'rgba(0,102,204,0.25)'" />

    <button
      (click)="sendMessage()"
      [disabled]="isLoading"
      class="w-10 h-10 rounded-full border-none cursor-pointer flex items-center justify-center text-base transition-all duration-300 hover:scale-110 disabled:opacity-50 disabled:cursor-not-allowed flex-shrink-0"
      [style.background]="isDark ? '#00e0ff' : '#0066cc'"
      style="color: #fff;">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>
</div>
