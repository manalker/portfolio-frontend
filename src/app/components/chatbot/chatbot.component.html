<!-- Bouton flottant -->
<button class="chatbot-toggle" (click)="toggleChat()">
  <i class="fas" [class.fa-comments]="!isOpen" [class.fa-times]="isOpen"></i>
</button>

<!-- Fenêtre chat -->
<div class="chatbot-window" [class.open]="isOpen">

  <!-- Header -->
  <div class="chatbot-header">
    <div class="chatbot-avatar">MK</div>
    <div>
      <div class="chatbot-name">Assistant de Manal</div>
      <div class="chatbot-status">
        <span class="status-dot"></span> En ligne
      </div>
    </div>
    <button class="chatbot-close" (click)="toggleChat()">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- Messages -->
  <div class="chatbot-messages" #messagesContainer>
    <div *ngFor="let msg of messages"
         class="message"
         [class.user]="msg.role === 'user'"
         [class.assistant]="msg.role === 'assistant'">
      <div class="message-bubble">{{ msg.content }}</div>
    </div>
    <div *ngIf="isLoading" class="message assistant">
      <div class="message-bubble typing">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chatbot-input">
    <input
      type="text"
      [(ngModel)]="userInput"
      (keypress)="onKeyPress($event)"
      placeholder="Posez une question..."
      [disabled]="isLoading" />
    <button (click)="sendMessage()" [disabled]="isLoading">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>
</div>
